<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gouta Maru Tank Calculator</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#0d47a1">

</head>

<body>

<header>

<h1>🚢 Gouta Maru</h1>

<p>Tank Volume Calculator</p>

</header>

<main class="container">

<div class="card">

<label>Select Tank</label>

<select id="tank">
<option>1 FOT P</option>
<option>1 FOT S</option>
<option>2 FOT P</option>
<option>2 FOT S</option>
</select>

<label>Mode</label>

<select id="mode">
<option>Sounding</option>
<option>Ullage</option>
</select>

<label>Value (cm)</label>

<input
type="number"
id="value"
placeholder="0">

<label>Trim (m)</label>

<input
type="number"
id="trim"
placeholder="0">

<button id="calculate">

CALCULATE

</button>

</div>

<div class="result">

<h2>Result</h2>

<h3 id="volume">

0.000 m³

</h3>

</div>

</main>

<script src="app.js"></script>

</body>
</html>
