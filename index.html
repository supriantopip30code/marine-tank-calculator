        .row > div { flex: 1; min-width: 110px; }
        .result { margin-top: 20px; padding: 18px 12px; background: linear-gradient(135deg, #e3edfa, #d4e4f5); border-radius: 20px; text-align: center; }

        .result .unit { font-size: 1rem; color: #1f4970; }
        .result .detail { font-size: 0.85rem; color: #1f4a6b; margin-top: 4px; opacity: 0.8; }
        .info-bar { display: flex; justify-content: space-between; margin-top: 12px; font-size: 0.8rem; color: #3d5f82; background: #f2f6fd; padding: 10px 14px; border-radius: 14px; flex-wrap: wrap; gap: 4px; }
        .info-bar .badge { background: #1f4a6b; color: white; padding: 2px 12px; border-radius: 30px; font-size: 0.7rem; }
        .error { color: #b0003a; background: #ffe8ec; padding: 10px 14px; border-radius: 14px; margin-top: 10px; display: none; font-size: 0.9rem; }
